apiVersion: apps/v1
kind: Deployment
metadata:
  name: seleniumdemoapp-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seleniumdemoapp
  template:
    metadata:
      labels:
        app: seleniumdemoapp
    spec:
      containers:
        - name: seleniumdemoapp
          image: indupriyasanga/flaskapp:kubeimage1 
          ports:
            - containerPort: 5001